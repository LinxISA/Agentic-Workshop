  pyc-pipeline:
    type: pinned-submodule-document
    path: vendor/pyCircuit/docs/PIPELINE.md
    use: source scan, JIT elaboration, specialization, manifest, hierarchy policy, and C++/Verilog backend evidence
  pyc-frontend-api:
    type: pinned-submodule-document
    path: vendor/pyCircuit/docs/FRONTEND_API.md
    use: module/function/const decorators, m.new, m.array, valueclass, and runtime value-param evidence
  pyc-ir-spec:
    type: pinned-submodule-document
    path: vendor/pyCircuit/docs/IR_SPEC.md
    use: hierarchy-preserving pyc.instance and strict module boundary evidence
  course-agc-design:
    type: course-design
    path: docs/superpowers/specs/2026-08-03-agentic-circuit-expansion-design.md
    use: proposed AGC API, Static/Runtime split, specialization key, passes, and responsibility boundaries
  agenda:
    type: local-text
    path: materials/agenda-2026.txt
    use: official talk title and presenter; course implementation uses two 75-minute teaching sessions
  roofline-paper:
    type: research-paper
    title: Roofline: An Insightful Visual Performance Model for Multicore Architectures
    use: arithmetic intensity, compute ceiling, bandwidth slope, ridge point
  pto-spec:
    type: pinned-submodule
    path: vendor/pto-spec
    revision: 9574f0293929bf692517dd29de11a8354440c7dc
    use: PTO instruction, architectural state, and effect semantics
  pycircuit:
    type: pinned-submodule
    path: vendor/pyCircuit
    revision: cc0203928b0c078468f2549a2477f891a17552e0
    use: cycle model and trace examples
  linxcore:
    type: pinned-submodule
    path: vendor/LinxCore
    revision: 2758fb007efccca8b1d4cf869480af99059e9f23
    use: modular processor case study
  ndf-course:
    type: course-document
    path: docs/NDF.md
    use: traceable architecture-model projection
  experiment-artifacts:
    type: reproducible-local-data
    path: experiments/artifacts
    use: trace, sweep, and Pareto evidence
  qproj-davincioo-lab:
    type: reproducible-local-data
    path: experiments/11_qproj_davincioo
    use: Qwen3-14B q_proj trace replay, live gfsim wrapper, provenance, and parameter sensitivity evidence
  davincioo-public-docs:
    type: environment-configured-source
    root_env: DAVINCIOO_ROOT
    use: high-level public DaVinciOO architecture, trace-flow, communication-extension, NDF, and pyCircuit documentation
  agentic-materials:
    type: local-materials
    paths:
      - materials/agentic_circuit_optimizer.md
      - materials/agentic_tao_physical_design_flow.md
    use: constrained proposal-measure-critique loop
  normative-language:
    type: local-material
    path: materials/normative_language.md
    use: distinction between normative requirements and explanatory claims
  course-model:
    type: course-synthesis
    use: explicitly labeled deterministic teaching models and parameters
  course-synthesis:
    type: course-synthesis
    use: architecture reasoning framework assembled for this tutorial
