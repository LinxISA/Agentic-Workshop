<text x="88" y="536" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="26" font-weight="700" fill="#17324D" text-anchor="start" >TMA B</text>
<line x1="210" y1="280" x2="1450" y2="280" stroke="#C7D2DC" stroke-width="1"/>
<line x1="210" y1="512" x2="1450" y2="512" stroke="#C7D2DC" stroke-width="1"/>
