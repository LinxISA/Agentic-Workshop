<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#17324D"/></marker></defs>
<rect x="0" y="0" width="1600" height="900" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0" />
<rect x="40" y="34" width="12" height="82" rx="6" fill="#168C84" stroke="none" stroke-width="0" />
<text x="76" y="74" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="38" font-weight="700" fill="#17324D" text-anchor="start" >乱序 TMA：参数必须绑定操作版本，数据就绪与参数稳定要分别判断</text>
<text x="76" y="108" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="400" fill="#657788" text-anchor="start" >程序顺序 A → B；在无内存顺序冲突且 B 数据先就绪时，B 可以先发射，A 仍必须使用 V1</text>
<rect x="50" y="150" width="1500" height="650" rx="20" fill="#F5F8FA" stroke="#D9E2EA" stroke-width="2" />
<rect x="110" y="180" width="200" height="42" rx="21" fill="#E8F1F8" stroke="none" stroke-width="0" /><text x="210.0" y="209" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="600" fill="#17324D" text-anchor="middle" >参数绑定</text>
<rect x="390" y="180" width="200" height="42" rx="21" fill="#E8F1F8" stroke="none" stroke-width="0" /><text x="490.0" y="209" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="600" fill="#17324D" text-anchor="middle" >就绪判断</text>
<rect x="670" y="180" width="200" height="42" rx="21" fill="#DDF3F2" stroke="none" stroke-width="0" /><text x="770.0" y="209" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="600" fill="#168C84" text-anchor="middle" >搬运</text>
<rect x="930" y="180" width="230" height="42" rx="21" fill="#DDF3F2" stroke="none" stroke-width="0" /><text x="1045.0" y="209" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="600" fill="#17324D" text-anchor="middle" >完成 / 可见性</text>
<rect x="1250" y="180" width="200" height="42" rx="21" fill="#E8F1F8" stroke="none" stroke-width="0" /><text x="1350.0" y="209" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="600" fill="#17324D" text-anchor="middle" >引用 / 存储回收</text>
<line x1="350" y1="202" x2="378" y2="202" stroke="#17324D" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="630" y1="202" x2="658" y2="202" stroke="#17324D" stroke-width="2.5" marker-end="url(#arrow)"/>
